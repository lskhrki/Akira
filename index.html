<!DOCTYPE html>
<html>
<head>
    <title>Thrift Grail Finder</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            max-width:800px;
            margin:auto;
            padding:40px;
        }
        h1{
            text-align:center;
        }
        input,button{
            width:100%;
            padding:12px;
            margin:10px 0;
            font-size:16px;
            box-sizing:border-box;
        }
        button{
            background:#000;
            color:white;
            border:none;
            cursor:pointer;
        }
        #results{
            margin-top:30px;
        }
        .platform-block{
            background:#fff;
            border:1px solid #ddd;
            border-radius:10px;
            padding:15px 20px;
            margin:15px 0;
        }
        .platform-header{
            display:flex;
            justify-content:space-between;
            align-items:baseline;
        }
        .platform-name{
            text-transform:capitalize;
            font-size:20px;
            font-weight:bold;
        }
        .platform-stats{
            color:#555;
            font-size:14px;
        }
        table{
            width:100%;
            border-collapse:collapse;
            margin-top:10px;
            font-size:14px;
        }
        th,td{
            text-align:left;
            padding:6px 4px;
            border-bottom:1px solid #eee;
        }
        .debug{
            margin-top:20px;
            font-size:13px;
            color:#666;
            background:#fff;
            border:1px solid #ddd;
            border-radius:8px;
            padding:12px;
        }
        .view-button{
            display:inline-block;
            background:#000;
            color:#fff;
            padding:10px 16px;
            border-radius:6px;
            text-decoration:none;
            margin-top:8px;
        }
        .warning{
            color:#b30000;
            font-weight:bold;
        }
    </style>
</head>
<body>
<h1>🧥 Thrift Grail Finder</h1>
<input
id="prompt"
placeholder="Example: nike dunks, oversized oxford shirt"
/>
<button onclick="searchItem()">
Search
</button>
<div id="results"></div>
<div id="debug" class="debug" style="display:none;"></div>
<script>
async function searchItem(){
    const prompt = document.getElementById("prompt").value.trim();
    const results = document.getElementById("results");
    const debugBox = document.getElementById("debug");

    if (!prompt) {
        results.innerHTML = "<p>Please enter something to search.</p>";
        return;
    }

    const q = encodeURIComponent(prompt);

    results.innerHTML = `
        <h2>Best places to find "${escapeHtml(prompt)}"</h2>

        <div class="platform-block">
            <div class="platform-header"><span class="platform-name">Myntra</span><span class="platform-stats">Live search</span></div>
            <p>Find matching products on Myntra.</p>
            <a class="view-button" href="https://www.myntra.com/${q.replace(/%20/g, "-")}" target="_blank">View Myntra Results</a>
        </div>

        <div class="platform-block">
            <div class="platform-header"><span class="platform-name">AJIO</span><span class="platform-stats">Live search</span></div>
            <p>Find matching products on AJIO.</p>
            <a class="view-button" href="https://www.ajio.com/search/?text=${q}" target="_blank">View AJIO Results</a>
        </div>

        <div class="platform-block">
            <div class="platform-header"><span class="platform-name">Meesho</span><span class="platform-stats">Live search</span></div>
            <p>Find matching products on Meesho.</p>
            <a class="view-button" href="https://www.meesho.com/search?q=${q}" target="_blank">View Meesho Results</a>
        </div>

        <div class="platform-block">
            <div class="platform-header"><span class="platform-name">Amazon India</span><span class="platform-stats">Live search</span></div>
            <p>Find matching products on Amazon.in.</p>
            <a class="view-button" href="https://www.amazon.in/s?k=${q}" target="_blank">View Amazon Results</a>
        </div>

        <div class="platform-block">
            <div class="platform-header"><span class="platform-name">Flipkart</span><span class="platform-stats">Live search</span></div>
            <p>Find matching products on Flipkart.</p>
            <a class="view-button" href="https://www.flipkart.com/search?q=${q}" target="_blank">View Flipkart Results</a>
        </div>

        <p id="liveStatus" style="color:#666;text-align:center;">Checking live matches in the background...</p>
    `;

    debugBox.style.display = "none";

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 6000);

    try {
        const response = await fetch("/compare", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({prompt:prompt}),
            signal:controller.signal
        });

        clearTimeout(timeout);
        if (!response.ok) throw new Error("Server returned " + response.status);

        const data = await response.json();
        const liveItems = [];

        Object.keys(data.platforms || {}).forEach(platform => {
            (data.platforms[platform].items || []).forEach(item => {
                if (!item.is_fallback) liveItems.push({...item, platform:platform});
            });
        });

        const status = document.getElementById("liveStatus");

        if (liveItems.length) {
            let liveHtml = `<div class="platform-block"><h2>Live Matches</h2>
                <table><tr><th>Platform</th><th>Item</th><th>Price</th><th></th></tr>`;

            liveItems.forEach(item => {
                liveHtml += `<tr>
                    <td>${escapeHtml(item.platform)}</td>
                    <td>${escapeHtml(item.title)}</td>
                    <td>₹${item.price}</td>
                    <td><a href="${item.url}" target="_blank">View</a></td>
                </tr>`;
            });

            liveHtml += `</table></div>`;
            results.insertAdjacentHTML("afterbegin", liveHtml);
            if (status) status.textContent = "Live matches found.";
        } else if (status) {
            status.textContent = "Showing live retailer search links. Render could not retrieve product cards directly.";
        }
    } catch (error) {
        clearTimeout(timeout);
        const status = document.getElementById("liveStatus");
        if (status) status.textContent = "Live scraping timed out. The search links above are ready.";
    }
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

</script>
</body>
</html>
