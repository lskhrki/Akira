<!DOCTYPE html>
<html>
<head>
    <title>Thrift Grail Finder</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            max-width:700px;
            margin:auto;
            padding:40px;
        }

        h1{
            text-align:center;
        }

        input,button{
            width:100%;
            padding:12px;
            margin:10px 0;
            font-size:16px;
        }

        button{
            background:#000;
            color:white;
            border:none;
            cursor:pointer;
        }

        #results{
            margin-top:30px;
            white-space:pre-wrap;
        }
    </style>
</head>

<body>

<h1>🧥 Thrift Grail Finder</h1>

<input
id="prompt"
placeholder="Example: Oversized Y2K leather jacket"
/>

<button onclick="searchItem()">
Search
</button>

<div id="results"></div>

<script>

async function searchItem(){

const prompt=document.getElementById("prompt").value;

const response=await fetch("/search",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
prompt:prompt
})

});

const data=await response.json();

const results = document.getElementById("results");

if (data.alerts_found === 0) {
    results.innerHTML = `
        <h2>No matching items found 😔</h2>
        <p>Try another search.</p>
    `;
} else {

    let html = `<h2>${data.alerts_found} Items Found</h2>`;

    data.alerts.forEach(item => {

        html += `
        <div style="
            border:1px solid #ccc;
            padding:15px;
            margin:15px 0;
            border-radius:10px;
        ">

            <h3>${item.title}</h3>

            <p><b>Price:</b> $${item.price_usd}</p>

            <p><b>Match Score:</b> ${item.match_score}%</p>

            <p><b>Authenticity:</b> ${item.authenticity_confidence}%</p>

            <a href="${item.url}" target="_blank">
                View Listing
            </a>

        </div>
        `;
    });

    results.innerHTML = html;
}

}
    {
     "alerts_found": 0,
     "listings_found": 0,
     "evaluations_count": 0,
     "scrape_debug": {
       "ebay": {"scraped": 0, "kept_after_filters": 0, "error": null},
       "depop": {"scraped": 0, "kept_after_filters": 0, "error": "TimeoutError: ..."},
       "grailed": {"scraped": 0, "kept_after_filters": 0, "error": null}
     },
     "warnings": ["GOOGLE_API_KEY is not set on the server — evaluation was skipped..."]
   }

</script>

</body>
</html>
